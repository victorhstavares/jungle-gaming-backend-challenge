worker_processes auto;

events {
  worker_connections 4096;
}

http {
  upstream wagering {
    least_conn;
    server app-1:3000 max_fails=3 fail_timeout=5s;
    server app-2:3000 max_fails=3 fail_timeout=5s;
    server app-3:3000 max_fails=3 fail_timeout=5s;
    keepalive 64;
  }

  server {
    listen 3000;
    client_max_body_size 64k;

    location / {
      proxy_pass http://wagering;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
      # nginx never resends a POST to another instance by default; idempotency keys would make it safe anyway.
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
      proxy_read_timeout 30s;
    }
  }
}
